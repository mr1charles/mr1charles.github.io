<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mr1charles</title>
<meta name="description" content="Games, apps and tools by mr1charles. Pick one to launch.">
<link rel="icon" href="/icon.png">
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#2a323f;--fg:#e8edf4;--mute:#8d99ab;--acc:#5ee1a0;--acc2:#7aa8ff;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f8;--panel:#fff;--line:#d6dce6;--fg:#161b24;--mute:#5b6676;--acc:#0b8a55;--acc2:#2a5bd7;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding:32px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:clamp(30px,6vw,46px);letter-spacing:-.02em;line-height:1.05}
h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:6px 0 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{font:inherit;color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0;width:240px}
input[type=search]:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;font-weight:600;color:var(--mute);background:transparent;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card:hover{border-color:var(--acc2)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h2{margin:0;font-size:20px;letter-spacing:-.01em}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.card p{margin:0;color:var(--mute);font-size:15px;flex:1}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:14px;font-weight:600;text-decoration:none;border-radius:8px;padding:8px 14px;border:1.5px solid var(--line);color:var(--fg)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;color:var(--acc);border:1.5px solid var(--acc);border-radius:99px;padding:2px 10px}
.links a.play{background:var(--acc);border-color:var(--acc);color:#07140d;font-size:15px;padding:10px 20px}
.links a.main{background:var(--acc);border-color:var(--acc);color:#07140d}
.links a:hover{border-color:var(--acc2)}
.empty{color:var(--mute);padding:20px 0}
footer{color:var(--mute);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--acc2)}
</style></head><body>
<div class="wrap">
<header>
 <div><h1>mr1<span>charles</span></h1><p class="sub">Everything I've built, in one place. Pick one to launch.</p></div>
 <div class="tools"><input id="q" type="search" placeholder="Search apps" aria-label="Search apps"></div>
</header>
<div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
<main class="grid" id="grid"></main>
<footer><a href="https://github.com/mr1charles">All repositories on GitHub</a><span>Open-source projects are public. Private projects are not listed.</span></footer>
</div>
<script>
var P="https://github.com/mr1charles/";
var APPS=[
{n:"Storm Royale",t:"Games",d:"Battle royale with a shrinking storm. Play it right in a browser tab, or download it for Windows, Mac, Linux, Android and iPhone.",play:"/play/",b:["Plays in your browser","Works offline after first load"],l:[["Game site","/storm-royale/"],["Downloads",P+"storm-royale-downloads/releases/latest"]]},
{n:"Royale Offline",t:"Games",d:"A fully offline Battle Royale in Godot 4: six biomes, a shrinking storm, two modes and a cosmetics economy.",l:[["Source",P+"fortnite-but-better",1]]},
{n:"Pixel Estates",t:"Games",d:"A player-built 3D island where you buy pixels of land, build on them and defend them.",l:[["Source",P+"ok-unfortunately-",1]]},
{n:"Little Toby",t:"Apps",d:"AI assistant for Linux with iPhone and Android apps.",l:[["Website","/linux-ai-assistant-/",1],["Android APK",P+"linux-ai-assistant-/releases/latest/download/LittleToby.apk"],["Source",P+"linux-ai-assistant-"]]},
{n:"Book of Babel",t:"Apps",d:"An archive of everything that could be written, with web, Android, iOS and Linux versions.",l:[["Open","/book-of-babel/",1],["Source",P+"book-of-babel"]]},
{n:"DockBox",t:"Apps",d:"One iOS app that runs and signs apps, built entirely by GitHub Actions. A LiveContainer fork.",l:[["Website","/signdock/",1],["Releases",P+"signdock/releases/latest"]]},
{n:"nxnative",t:"Apps",d:"Run your own Switch games natively on iPhone, iPad and Mac. Not an emulator. You bring your own game and keys.",l:[["Source",P+"nxnative",1]]},
{n:"DreamTweaks",t:"Apps",d:"iPhone 12 customization prototype: a Dynamic Island style peninsula and a Second Space.",l:[["Source",P+"iphonestuff",1]]},
{n:"HelixOS",t:"Tools",d:"A macOS-style Linux desktop for everyday laptops, with a Dynamic Island in the menu bar.",l:[["Source",P+"new-os-",1]]},
{n:"TermiLyrics",t:"Tools",d:"Terminal lyric synchronizer with animated ASCII visuals. Free and open source.",l:[["Source",P+"TermiLyrics",1],["Latest release",P+"TermiLyrics/releases/latest"]]},
{n:"powerd",t:"Tools",d:"Adaptive power and performance daemon for CachyOS and other Arch laptops, written in Rust.",l:[["Source",P+"powerd",1],["Latest release",P+"powerd/releases/latest"]]},
{n:"Galaxy A13 LineageOS",t:"Research",d:"Research notes for running LineageOS 23.2 on the Samsung Galaxy A13.",l:[["Notes","/a13-lineageos-research/",1],["Source",P+"a13-lineageos-research"]]}
];
var cats=["All","Games","Apps","Tools","Research"],cur="All";
var chips=document.getElementById("chips"),grid=document.getElementById("grid"),q=document.getElementById("q");
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
cats.forEach(function(c){var b=el("button","chip",c);b.type="button";b.onclick=function(){cur=c;draw()};chips.appendChild(b)});
function draw(){
 [].forEach.call(chips.children,function(b){b.setAttribute("aria-pressed",b.textContent===cur)});
 var s=q.value.trim().toLowerCase();grid.textContent="";var n=0;
 APPS.forEach(function(a){
  if(cur!=="All"&&a.t!==cur)return;
  if(s&&(a.n+" "+a.d).toLowerCase().indexOf(s)<0)return;
  n++;var c=el("article","card"),top=el("div","top");
  top.appendChild(el("h2",null,a.n));top.appendChild(el("span","tag",a.t));c.appendChild(top);
  c.appendChild(el("p",null,a.d));
  if(a.b){var bd=el("div","badges");a.b.forEach(function(x){bd.appendChild(el("span","badge",x))});c.appendChild(bd)}
  var l=el("div","links");
  if(a.play){var pa=el("a","play","Open the game");pa.href=a.play;l.appendChild(pa)}
  a.l.forEach(function(x){var A=el("a",x[2]?"main":"",x[1]===undefined?"":x[0]);A.href=x[1];if(x[1].charAt(0)!=="/")A.rel="noopener";l.appendChild(A)});
  c.appendChild(l);grid.appendChild(c)});
 if(!n)grid.appendChild(el("p","empty","No apps match that search."));
}
q.addEventListener("input",draw);draw();
</script></body></html>
